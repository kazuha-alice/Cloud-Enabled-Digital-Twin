<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cloud-Enabled Digital Twin README hero</title>
  <desc id="desc">Modern technical banner for a deprecated Cloud-Enabled Digital Twin prototype archive.</desc>
  <style>
    .bg { fill: #0b1220; }
    .grid { stroke: #263445; stroke-width: 1; opacity: .45; }
    .panel { fill: #111827; stroke: #334155; stroke-width: 1; }
    .panel-soft { fill: #152033; stroke: #334155; stroke-width: 1; }
    .blue { fill: #38bdf8; }
    .green { fill: #34d399; }
    .orange { fill: #fb923c; }
    .red { fill: #f87171; }
    .muted { fill: #94a3b8; }
    .white { fill: #f8fafc; }
    .line { stroke: #38bdf8; stroke-width: 2; }
    .line-soft { stroke: #475569; stroke-width: 2; }
    .title { font: 700 48px Arial, Helvetica, sans-serif; letter-spacing: 0; }
    .subtitle { font: 400 20px Arial, Helvetica, sans-serif; letter-spacing: 0; }
    .label { font: 700 14px Arial, Helvetica, sans-serif; letter-spacing: .08em; }
    .small { font: 600 15px Arial, Helvetica, sans-serif; letter-spacing: 0; }
    .tiny { font: 500 13px Arial, Helvetica, sans-serif; letter-spacing: 0; }
